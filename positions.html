<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <title>Positions | Forex Terminal</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/trades.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar-container">
            <div class="loading-state">Loading navigation...</div>
        </aside>
        <div class="main-content">
            <header class="topbar" id="topbar-container"></header>
            <main class="page-content">
                <section class="page-header">
                    <h1>Open Positions</h1>
                </section>
                <section class="panel">
                    <div class="panel-header"><h2>Active Trades</h2></div>
                    <div class="panel-body">
                        <div class="table-container">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Symbol</th>
                                        <th>Dir</th>
                                        <th>Size</th>
                                        <th>Entry</th>
                                        <th>Current</th>
                                        <th>P&L</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="positions-table-body">
                                    <!-- Rows injected here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>
    
    <!-- Fixed script path -->
    <script type="module" src="../assets/js/app.js"></script>
    <script type="module" src="../assets/js/trading/positions.js"></script>
</body>
</html>
