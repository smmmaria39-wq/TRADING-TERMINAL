<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  
    <title>Economic Calendar | Forex Terminal</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/analysis.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar-container">
            <div class="loading-state">Loading navigation...</div>
        </aside>
        <div class="main-content">
            <header class="topbar" id="topbar-container"></header>
            <main class="page-content">
                <section class="page-header">
                    <h1>Economic Calendar</h1>
                </section>
                <section class="panel">
                    <div class="panel-body">
                        <div class="table-container">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Time</th>
                                        <th>Currency</th>
                                        <th>Event</th>
                                        <th>Importance</th>
                                        <th>Actual</th>
                                        <th>Forecast</th>
                                        <th>Previous</th>
                                    </tr>
                                </thead>
                                <tbody id="economic-calendar-body">
                                    <!-- Rows injected here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>
    
    <!-- Fixed script path -->
    <script type="module" src="../assets/js/app.js"></script>
    <script type="module" src="../assets/js/fundamentals/economicCalendar.js"></script>
</body>
</html>
