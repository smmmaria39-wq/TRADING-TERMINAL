<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  
    <title>Dashboard | Forex Analysis Terminal</title>
  
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar-container">
            <div class="loading-state">Loading navigation...</div>
        </aside>

        <div class="main-content">
            <header class="topbar" id="topbar-container"></header>

            <main class="page-content">
                <section class="page-header">
                    <h1>Dashboard</h1>
                    <div class="market-status" id="dashboard-connection-status">
                        <span class="status-dot disconnected"></span>
                        <span>Disconnected</span>
                    </div>
                </section>

                <!-- Market Overview -->
                <section class="panel market-overview-panel">
                    <div class="panel-header">
                        <h2>Market Overview</h2>
                        <select id="dashboard-symbol-selector" class="form-control" aria-label="Select market symbol">
                            <option value="">Select Symbol</option>
                        </select>
                    </div>
                    <div class="panel-body">
                        <div class="data-grid" id="market-overview-data">
                            <div class="data-item"><span class="label">Bid</span><span class="value">—</span></div>
                            <div class="data-item"><span class="label">Ask</span><span class="value">—</span></div>
                            <div class="data-item"><span class="label">Spread</span><span class="value">—</span></div>
                            <div class="data-item"><span class="label">Change</span><span class="value">—</span></div>
                        </div>
                    </div>
                </section>

                <!-- Main Chart Area -->
                <section class="panel chart-panel">
                    <div class="panel-header">
                        <h2>Price Chart</h2>
                        <div class="chart-controls">
                            <select id="chart-timeframe" class="form-control" aria-label="Select timeframe">
                                <option value="M1">M1</option>
                                <option value="M5">M5</option>
                                <option value="M15" selected>M15</option>
                                <option value="M30">M30</option>
                                <option value="H1">H1</option>
                                <option value="H4">H4</option>
                                <option value="D1">D1</option>
                                <option value="W1">W1</option>
                            </select>
                        </div>
                    </div>
                    <!-- FIX: Separated panel-body and chart-container to prevent layout conflicts -->
                    <div class="panel-body" style="padding: 0;">
                        <div class="chart-container" id="main-chart-container">
                            <div class="empty-state">Chart library not connected. Waiting for backend data.</div>
                        </div>
                    </div>
                </section>

                <!-- Analysis & Signals Grid -->
                <div class="grid-2-col">
                    <section class="panel">
                        <div class="panel-header"><h2>Analysis Summary</h2></div>
                        <div class="panel-body" id="analysis-summary-container">
                            <div class="empty-state">No analysis data</div>
                        </div>
                    </section>

                    <section class="panel signal-panel">
                        <div class="panel-header"><h2>Active Signal</h2></div>
                        <div class="panel-body" id="active-signal-container">
                            <div class="empty-state">No active signals</div>
                        </div>
                    </section>
                </div>

                <!-- Account Summary -->
                <section class="panel">
                    <div class="panel-header"><h2>Account Summary</h2></div>
                    <div class="panel-body">
                        <div class="data-grid" id="account-summary-data">
                            <div class="data-item"><span class="label">Balance</span><span class="value">—</span></div>
                            <div class="data-item"><span class="label">Equity</span><span class="value">—</span></div>
                            <div class="data-item"><span class="label">Margin</span><span class="value">—</span></div>
                            <div class="data-item"><span class="label">Free Margin</span><span class="value">—</span></div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- FIX: Corrected script path (assets/js/ not assets/j/) -->
    <script type="module" src="../assets/js/app.js"></script>
    <script type="module">
        import dashboard from '../assets/js/dashboard/dashboard.js';
        document.addEventListener('DOMContentLoaded', () => dashboard.init());
    </script>
</body>
</html>
