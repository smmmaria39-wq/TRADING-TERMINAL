<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  
    <title>Settings | Forex Terminal</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/settings.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar-container">
            <div class="loading-state">Loading navigation...</div>
        </aside>
        <div class="main-content">
            <header class="topbar" id="topbar-container"></header>
            <main class="page-content">
                <section class="page-header">
                    <h1>Settings</h1>
                </section>
                <div class="settings-layout">
                    <nav class="settings-nav panel">
                        <ul>
                            <li class="active" data-tab="account">Account</li>
                            <li data-tab="trading">Trading</li>
                            <li data-tab="notifications">Notifications</li>
                            <li data-tab="appearance">Appearance</li>
                            <li data-tab="security">Security</li>
                        </ul>
                    </nav>
                    <section class="panel">
                        <div class="panel-header"><h2 id="settings-panel-title">Account Settings</h2></div>
                        <div class="panel-body" id="settings-panel-body">
                            <div class="order-group"><label>Name</label><input type="text" class="form-control" placeholder="—"></div>
                            <div class="order-group"><label>Email</label><input type="email" class="form-control" placeholder="—"></div>
                            <button class="btn btn-primary">Save Changes</button>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>
    
    <!-- Fixed script paths (removed duplicate) -->
    <script type="module" src="../assets/js/app.js"></script>
    <script type="module" src="../assets/js/settings.js"></script>
</body>
</html>
